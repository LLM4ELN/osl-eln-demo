# Benchmark configuration for OOLD agent evaluation
# model stats from https://models.dev/api.json (2026-02-13)

benchmark:
  agent_type:
    # - "iterative"
    # - "segmentation"
    - "multi_step"
  runs: 3
  timeout: 900  # seconds per run
  parallel_models: true
  parallel_runs: false
  models:  # references model_name values from model_list
    - claude-sonnet-4-5
    - claude-haiku-4-5
    - claude-opus-4-5
    #- deepseek-v3.2-speciale # error: timeout
    - deepseek-v3.2
    #- deepseek-r1-0528 # error: timeout
    - cohere-command-a
    - llama-4-maverick
    #- kimi-k2.5 # slow & bad performance
    #- kimi-k2-thinking # slow & bad performance
    - gpt-5.2-chat
    - gpt-5-nano
    - gpt-5-mini
    #- gpt-oss-120b # deployment not operational
    #- phi-4-mini-instruct # error: json-schema grammar not supported
    #- phi-4-reasoning # error: json-schema grammar not supported
    - mistral-large-3
    - mistral-medium-2505
    - mistral-small-2503
    #- glm-4.7-flash # not deployed
    #- qwen-3-coder-next-q6_k-gguf # not deployed
    #- ministral-3-14b-instruct-2512 # not deployed
    #- gpt-oss-120b-vllm # not deployed
    #- mistral-small-3.2-24b-instruct-2506-vllm # not deployed
    #- devstral-small-2-24b-instruct-2512-vllm # not deployed
    - mistral-small-3.2-24b-instruct-2506-mistralai
    - devstral-small-2-24b-instruct-2512-mistralai
    - devstral-2-123b-instruct-2512-mistralai
    #- magistral-small-2509-mistralai # error: timeout
    #- magistral-small-2509-vllm
    #- ministral-3:14b # local
    #- mistral:7b # local

# model configurations based on https://docs.litellm.ai/docs/proxy/configs
model_list:
  - model_name: claude-sonnet-4-5
    litellm_params:
      model: claude-sonnet-4-5
      api_base: os.environ/ANTHROPIC_API_ENDPOINT
      api_key: os.environ/API_KEY
      api_version: "2024-02-15"
      temperature: 0.0
    provider: azure-foundry-anthropic
    db_model_id: claude-sonnet-4-5
    provider_id: azure
    price_per_million_token_in: 3
    price_per_million_token_out: 15
    comment: works

