benchmark:
  agent_type:
    # - "iterative"
    # - "segmentation"
    - "multi_step"
  runs: 3
  timeout: 900  # seconds per run
  parallel_models: true
  parallel_runs: false
  models:  # references model_name values from model_list
    - claude-sonnet-4-5
    - claude-haiku-4-5
    - claude-opus-4-5
    #- deepseek-v3.2-speciale # error: timeout
    - deepseek-v3.2
    #- deepseek-r1-0528 # error: timeout
    - cohere-command-a
    - llama-4-maverick
    #- kimi-k2.5 # slow & bad performance
    #- kimi-k2-thinking # slow & bad performance
    - gpt-5.2-chat
    - gpt-5-nano
    - gpt-5-mini
    - gpt-oss-120b
    #- phi-4-mini-instruct # error: json-schema grammar not supported
    #- phi-4-reasoning # error: json-schema grammar not supported
    - mistral-large-3
    - mistral-medium-2505
    - mistral-small-2503
    #- glm-4.7-flash # not deployed
    - qwen-3-coder-next-q6_k-gguf

# model configurations based on https://docs.litellm.ai/docs/proxy/configs
model_list:
  - model_name: claude-sonnet-4-5
    litellm_params:
      model: claude-sonnet-4-5
      api_base: os.environ/ANTHROPIC_API_ENDPOINT
      api_key: os.environ/API_KEY
      api_version: "2024-02-15"
      temperature: 0.0
    provider: azure-foundry-anthropic
    comment: works

  - model_name: claude-haiku-4-5
    litellm_params:
      model: claude-haiku-4-5
      api_base: os.environ/ANTHROPIC_API_ENDPOINT
      api_key: os.environ/API_KEY
      api_version: "2024-02-15"
      temperature: 0.0
    provider: azure-foundry-anthropic
    comment: works

  - model_name: claude-opus-4-5
    litellm_params:
      model: claude-opus-4-5
      api_base: os.environ/ANTHROPIC_API_ENDPOINT
      api_key: os.environ/API_KEY
      api_version: "2024-02-15"
      temperature: 0.0
    provider: azure-foundry-anthropic
    comment: works

  - model_name: deepseek-v3.2-speciale
    litellm_params:
      model: deepseek-v3.2-speciale
      api_base: os.environ/API_ENDPOINT
      api_key: os.environ/API_KEY
      temperature: 0.0
    provider: azure-foundry
